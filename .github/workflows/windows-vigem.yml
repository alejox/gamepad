# Builds ViGEmClient.dll from archived upstream source (we never commit
# binaries), exercises the real native paths, and packages the complete Windows
# host. Runners have no ViGEmBus kernel driver, so package smoke tests expect
# the real ViGEm probe to fall back to keyboard/mouse.
name: windows-vigem

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "apps/server/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/windows-vigem.yml"
  pull_request:
    paths:
      - "apps/server/**"
      - "packages/shared/**"
      - "package-lock.json"
      - ".github/workflows/windows-vigem.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # nefarius/ViGEmClient master HEAD (repo archived; 1.21.222.0 + later fixes).
  VIGEMCLIENT_SHA: b66d02d57e32cc8595369c53418b843e958649b4

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout ViGEmClient
        uses: actions/checkout@v4
        with:
          repository: nefarius/ViGEmClient
          ref: ${{ env.VIGEMCLIENT_SHA }}
          path: vigemclient

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Release_DLL defines VIGEM_DYNAMIC + VIGEM_EXPORTS (src/ViGEmClient.vcxproj)
      # so the functions are exported, and links the CRT statically (/MT).
      # CMake's ViGEmClient_DLL option does not define them, so its DLL would
      # export nothing. The project targets v142; the runner ships v143.
      - name: Build ViGEmClient.dll (Release_DLL x64)
        working-directory: vigemclient
        run: msbuild src\ViGEmClient.vcxproj /m /p:Configuration=Release_DLL /p:Platform=x64 /p:PlatformToolset=v143

      - name: Check exports and stage the DLL
        shell: pwsh
        run: |
          $dll = "vigemclient\bin\release\x64\ViGEmClient.dll"
          $exports = dumpbin /exports $dll | Out-String
          foreach ($fn in "vigem_alloc","vigem_free","vigem_connect","vigem_disconnect","vigem_target_x360_alloc","vigem_target_free","vigem_target_add","vigem_target_remove","vigem_target_x360_update") {
            if ($exports -notmatch "\b$fn\b") { throw "missing export: $fn" }
          }
          New-Item -ItemType Directory -Force apps\server\native\win32-x64 | Out-Null
          Copy-Item $dll apps\server\native\win32-x64\ViGEmClient.dll

      - uses: actions/upload-artifact@v4
        with:
          name: ViGEmClient-win32-x64
          path: apps/server/native/win32-x64/ViGEmClient.dll
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Server unit tests
        run: npm run test -w @gamepad/server
      - name: ViGEm smoke test
        working-directory: apps/server
        run: npx tsx --conditions=source scripts/vigem-smoke.ts

      - name: Install Inno Setup
        run: choco install innosetup --version 6.4.0 --allow-downgrade --no-progress --yes

      - name: Build installer and portable package
        working-directory: apps/server
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like "refs/tags/v*") { $version = $env:GITHUB_REF_NAME.Substring(1) }
          & scripts/package-windows.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }

      - name: Smoke test portable package
        working-directory: apps/server
        run: python scripts/windows-package-smoke.py dist/windows/AlejoxGamepad

      - name: Smoke test installed package and uninstaller
        working-directory: apps/server
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like "refs/tags/v*") { $version = $env:GITHUB_REF_NAME.Substring(1) }
          $setup = Resolve-Path "dist/artifacts/AlejoxGamepad-Setup-$version.exe"
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /TASKS=""
          if ($LASTEXITCODE -ne 0) { throw "Silent install failed: $LASTEXITCODE" }
          $installed = "$env:ProgramFiles/AlejoxGamepad"
          python scripts/windows-package-smoke.py $installed
          if ($LASTEXITCODE -ne 0) { throw "Installed package smoke failed" }
          $uninstaller = Get-ChildItem "$installed/unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "Uninstaller not found" }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Silent uninstall failed: $LASTEXITCODE" }
          if (Test-Path "$installed/AlejoxGamepad.exe") { throw "Uninstaller left the application executable behind" }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: AlejoxGamepad-Windows
          path: |
            apps/server/dist/artifacts/AlejoxGamepad-Setup-*.exe
            apps/server/dist/artifacts/AlejoxGamepad-Portable-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/server/dist/artifacts/AlejoxGamepad-Setup-*.exe
            apps/server/dist/artifacts/AlejoxGamepad-Portable-*.zip
          generate_release_notes: true
